version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations/*.up.sql"
    gen:
      go:
        package: "dbgen"
        out: "internal/gen/dbgen"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.int8"
            go_type: "int64"
